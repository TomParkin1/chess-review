[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "chessreview"
version = "0.1.0"
description = "Analyse your chess.com games with Stockfish and train on your own mistakes, locally."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
# compression.zstd (the puzzle library download) is new in Python 3.14.
requires-python = ">=3.14"
dependencies = [
    "chess==1.11.2",
    "Flask==3.1.3",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Board Games",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.5",
    "mypy==2.4.1",
]

[project.scripts]
chessreview = "chessreview.__main__:main"

[tool.setuptools]
packages = ["chessreview"]

[tool.setuptools.package-data]
chessreview = ["data/*", "templates/*", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:chess.engine"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
# Keep short collections on one line when they fit, rather than one item per line.
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["chessreview.config.BackupConfig"]

[tool.mypy]
python_version = "3.14"
packages = ["chessreview"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
