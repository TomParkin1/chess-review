# Chess review configuration. Edit freely; restart the app after changes.

[player]
# username = "your-chess.com-name"   # optional: the app asks for it on first run (Settings can change it)

[import]
min_plies = 10            # skip games shorter than this (aborted / instant resignations)
skip_variants = true      # skip Chess960 and other non-standard games

[engine]
path = ""                 # Stockfish executable; empty = $STOCKFISH_PATH, then your PATH, then common folders
time_per_position = 0.3   # seconds of engine time per position (at most)
max_depth = 20            # ...or stop earlier once this depth is reached (0 = no cap)
workers = 0               # Stockfish processes run in parallel; 0 = automatic (~2/3 of CPU cores)
threads = 1               # threads per process: 1 gives the most positions per second
hash_mb = 128             # hash table per Stockfish process
pv_length = 8             # moves of the principal variation to store

[classification]
# Adaptive: thresholds depend on the mover's rating in that game (lower rating -> only bigger
# swings count). false = always the standard values below. The Settings page can override this.
adaptive = true
# "winchance" (Lichess style) or "cp" (raw centipawn loss)
mode = "winchance"
# Drops in win chance on Lichess' -1..1 scale (0.1 = 5 percentage points).
inaccuracy = 0.1
mistake = 0.2
blunder = 0.3
# Used when mode = "cp"
cp_inaccuracy = 50
cp_mistake = 100
cp_blunder = 300

[phases]
opening_plies = 20        # first N half-moves count as the opening
endgame_material = 13     # endgame when non-pawn material (both sides, N/B=3 R=5 Q=9) <= this

[review]
playout_tactical = 3      # moves to play out after finding a missed mate / tactic / capture
playout_other = 1         # moves to play out for defensive and positional mistakes
live_time = 0.35          # engine seconds per position when judging a move you try (4 threads)

[analysis]
max_seconds = 10          # live analysis board: stop searching a position after this long
multipv = 3               # number of engine lines shown

[training]
new_per_day = 10          # new mistakes added to the daily Train queue each day
include_inaccuracies = false
blind = true              # Train shows positions as in a real game: no "you blundered here" clue

[coach]
calm_ratio = 0.3          # share of real-game positions where you played well (so there isn't always a trick)
recent_games = 100        # those calm positions come from your last N games
budget_minutes = 20       # Today: default time budget, 10, 20 or 30 (the Today page can change it)
seconds_per_puzzle = 60   # Today: time per puzzle until your own pace is known (after 30 puzzles)
review_share = 0.8        # Today: due reviews take at most this share of the puzzles (all of them
                          # when more is due than fits in a day, so a backlog clears)
new_share = 0.7           # Today: new cards only while due reviews fill less than this share
session_days = 3          # an unfinished new-games session joins daily training after this many days
history_days = 14         # an import whose games are mostly older than this is history, not a session
progress_window = 25      # Progress: your last N games compared with the N before
self_review_games = 5     # New-games session: games where you find the turning point yourself first

[database]
path = "data/chess.db"

[backup]
# Copies of the database in data/backups (made with SQLite's backup API, safe while the app runs).
daily = 7                 # one a day while the app is running
weekly = 4                # the first daily copy of each week
other = 10                # "Back up now" and the copies made before Delete all, reclassifying,
                          # database upgrades, puzzle-library updates and restores
