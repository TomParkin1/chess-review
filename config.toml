# Chess review configuration. Edit freely; restart the app after changes.

[player]
username = "sampleplayer"

[import]
min_plies = 10            # skip games shorter than this (aborted / instant resignations)
skip_variants = true      # skip Chess960 and other non-standard games

[engine]
path = "/opt/homebrew/bin/stockfish"
time_per_position = 0.3   # seconds of engine time per position
workers = 4               # Stockfish processes run in parallel
threads = 2               # threads per Stockfish process
hash_mb = 128             # hash table per Stockfish process
pv_length = 8             # moves of the principal variation to store

[classification]
# "winchance" (Lichess style) or "cp" (raw centipawn loss)
mode = "winchance"
# Drops in win chance on Lichess' -1..1 scale (0.1 = 5 percentage points).
inaccuracy = 0.1
mistake = 0.2
blunder = 0.3
# Used when mode = "cp"
cp_inaccuracy = 50
cp_mistake = 100
cp_blunder = 300

[phases]
opening_plies = 20        # first N half-moves count as the opening
endgame_material = 13     # endgame when non-pawn material (both sides, N/B=3 R=5 Q=9) <= this

[review]
playout_tactical = 3      # moves to play out after finding a missed mate / tactic / capture
playout_other = 1         # moves to play out for defensive and positional mistakes
live_time = 0.5           # engine seconds per position when judging a move you try

[analysis]
max_seconds = 10          # live analysis board: stop searching a position after this long
multipv = 3               # number of engine lines shown

[database]
path = "data/chess.db"
