# Configuration for the test suite (selected in conftest.py). Anything not set here uses the defaults in
# chessreview/config.py. The fixtures' games are played by "sampleplayer".

[player]
username = "sampleplayer"

[engine]
max_depth = 20

[database]
# Every test opens its own temporary database; this path only guards the real one if a test forgets.
path = "data/unused-test.db"     # relative to this file: tests/data/
