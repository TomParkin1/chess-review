{% extends "base.html" %}
{% block title %}Today · Chess Review{% endblock %}
{% block content %}
<section id="plan-view">
  <section class="card train-hero" id="train-start">
    <div class="ring-wrap" id="ring"></div>
    <div class="train-copy">
      <h1>Today's workout</h1>
      <p class="muted" id="train-sub">Loading your plan…</p>
      <div class="budget-row" id="budget-row" hidden><span class="muted small">Time today</span>
        <div class="segmented" id="budget" role="group" aria-label="Time today"></div></div>
      <label class="mode-toggle" title="Reviews appear as in a real game: nothing says a mistake was made, and you name the opponent's threat first">
        <input type="checkbox" id="blind-toggle"> Real game mode for reviews</label>
      <div class="actions">
        <button class="btn primary big" id="start-btn" hidden>Start workout</button>
        <a class="btn primary big" id="home-link" href="/" hidden>Go to Home</a>
        <a class="btn big" id="practice-link" href="/review" hidden>Practise more</a>
      </div>
    </div>
    <div class="streak" id="streak"></div>
  </section>

  <section class="card" id="plan-card">
    <div class="card-title"><h2>The plan</h2>
      <span class="table-actions"><span class="muted small" id="plan-note"></span>
        <button class="btn small" id="refresh-btn" hidden
                title="Rebuild today's plan from your latest games. What you've done today is kept.">⟳ Refresh plan</button></span></div>
    <div class="feedback" id="stale-note" hidden></div>
    <ol class="blocks" id="blocks"></ol>
  </section>
</section>

<section class="card summary-card" id="block-done" hidden></section>

{% set puzzle_hidden = True %}
{% include "_puzzle.html" %}
{% endblock %}
{% block scripts %}<script type="module" src="{{ url_for('static', filename='train.js') }}"></script>{% endblock %}
