{% extends "base.html" %}
{% block title %}Game · Chess Review{% endblock %}
{% block content %}
<div class="game-header" id="game-header"></div>
<div class="layout">
  <div class="board-col">
    <div class="board-wrap"><div id="board" class="board"></div></div>
    <div class="controls">
      <button class="btn" data-nav="first" title="Start (Home)">⏮</button>
      <button class="btn" data-nav="prev" title="Previous (←)">◀</button>
      <button class="btn" data-nav="next" title="Next (→)">▶</button>
      <button class="btn" data-nav="last" title="End (End)">⏭</button>
      <button class="btn" id="flip-btn" title="Flip board (f)">⇅</button>
      <label class="toggle"><input type="checkbox" id="best-toggle" checked> Best move arrow</label>
    </div>
    <div id="graph" class="graph"></div>
  </div>
  <div class="side-col">
    <div class="eval-line"><span id="eval-text" class="eval"></span> <span id="best-text" class="muted"></span></div>
    <div id="explanation" class="explanation" hidden></div>
    <div id="moves" class="moves"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>window.GAME_ID = {{ game_id }};</script>
<script type="module" src="{{ url_for('static', filename='game.js') }}"></script>
{% endblock %}
