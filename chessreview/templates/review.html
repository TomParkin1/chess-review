{% extends "base.html" %}
{% block title %}Practice · Chess Review{% endblock %}
{% block content %}
<div class="card filter-bar">
  {% include "_practice_switch.html" %}
  <span class="filter-summary" id="filter-summary"></span>
  <span class="table-actions">
    <label class="mode-toggle" title="Hide that a mistake was made and ask for the opponent's threat first">
      <input type="checkbox" id="blind-toggle"> Real game mode</label>
    <button class="btn small" id="reset-filters" hidden>Reset to recommended</button>
    <button class="btn small" id="toggle-filters" aria-expanded="false">⚙ Filters</button>
  </span>
</div>
<form id="filters" class="filters card" hidden>
  <label>Show
    <select name="status">
      <option value="unsolved">Not solved yet</option>
      <option value="new">Never tried</option>
      <option value="failed">Failed / skipped</option>
      <option value="solved">Solved</option>
      <option value="">All</option>
    </select>
  </label>
  <label>Severity
    <select name="judgement">
      <option value="mistake,blunder">Mistakes + blunders</option>
      <option value="blunder">Blunders only</option>
      <option value="inaccuracy,mistake,blunder">All incl. inaccuracies</option>
    </select>
  </label>
  <label>Games
    <select name="last">
      <option value="">All games</option>
      <option value="10">Last 10</option>
      <option value="20">Last 20</option>
      <option value="50" selected>Last 50</option>
      <option value="100">Last 100</option>
      <option value="200">Last 200</option>
    </select>
  </label>
  <label>Opening <select name="opening"><option value="">All</option></select></label>
  <label>Phase <select name="phase"><option value="">All</option></select></label>
  <label>Result <select name="result"><option value="">All</option></select></label>
  <label>Colour <select name="color"><option value="">All</option></select></label>
  <label>Time <select name="time_class"><option value="">All</option></select></label>
  <label>Type <select name="kind"><option value="">All</option></select></label>
  <label>Order
    <select name="sort">
      <option value="worst">Worst first</option>
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
    </select>
  </label>
</form>

<div id="game-filter" class="card" hidden></div>
<div id="empty" class="card muted" hidden>No mistakes match these filters.</div>

{% include "_puzzle.html" %}
{% endblock %}
{% block scripts %}<script type="module" src="{{ url_for('static', filename='review.js') }}"></script>{% endblock %}
