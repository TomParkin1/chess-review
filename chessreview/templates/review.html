{% extends "base.html" %}
{% block title %}Review mistakes · Chess Review{% endblock %}
{% block content %}
<form id="filters" class="filters card">
  <label>Show
    <select name="judgement">
      <option value="mistake,blunder">Mistakes + blunders</option>
      <option value="blunder">Blunders only</option>
      <option value="inaccuracy,mistake,blunder">All incl. inaccuracies</option>
    </select>
  </label>
  <label>Opening <select name="opening"><option value="">All</option></select></label>
  <label>Phase <select name="phase"><option value="">All</option></select></label>
  <label>Result <select name="result"><option value="">All</option></select></label>
  <label>Colour <select name="color"><option value="">All</option></select></label>
  <label>Time <select name="time_class"><option value="">All</option></select></label>
  <label>Type <select name="kind"><option value="">All</option></select></label>
  <label>Sort
    <select name="sort">
      <option value="worst">Worst first</option>
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
    </select>
  </label>
  <label class="toggle"><input type="checkbox" name="quiz"> Quiz mode (try before seeing the answer)</label>
</form>

<div id="empty" class="card muted" hidden>No mistakes match these filters.</div>

<div class="layout" id="review">
  <div class="board-col">
    <div class="board-wrap"><div id="board" class="board"></div></div>
    <div class="controls">
      <button class="btn" id="prev-btn" title="Previous mistake (←)">◀ Prev</button>
      <span id="counter" class="muted"></span>
      <button class="btn" id="next-btn" title="Next mistake (→)">Next ▶</button>
    </div>
  </div>
  <div class="side-col">
    <div class="review-head">
      <span id="badge" class="badge"></span>
      <h2 id="move-title"></h2>
    </div>
    <p id="context" class="muted"></p>
    <div id="answer">
      <div class="evals">
        <div><span class="muted">Before</span> <span id="eval-before" class="eval"></span></div>
        <div><span class="muted">After your move</span> <span id="eval-after" class="eval"></span></div>
      </div>
      <p class="muted small">Evaluations from your point of view.</p>
      <div id="explanation" class="explanation"></div>
      <p class="legend"><span class="swatch red"></span> your move <span class="swatch green"></span> best move</p>
      <p id="best-line" class="muted"></p>
    </div>
    <div id="try-panel" class="try" hidden>
      <p id="try-msg"></p>
    </div>
    <div class="actions">
      <button class="btn primary" id="try-btn">Try again</button>
      <button class="btn" id="show-btn" hidden>Show answer</button>
      <a class="btn" id="game-link" href="#">Open game</a>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}<script type="module" src="{{ url_for('static', filename='review.js') }}"></script>{% endblock %}
