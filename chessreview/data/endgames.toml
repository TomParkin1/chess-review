[[endgame]]
id = "vancura"
level = 3
title = "Vancura: defend against the a-pawn"
# Vancura's set-up (P12): pawn on a6, rook in front on a8. Stockfish, 1.5 s a move: the rook moves
# that head for the side of the pawn hold (...Rf1-f6, ...Ra4-f4-f6, ...Re1+-e6, ...Rb1/Rc1/Rd1);
# king moves, ...Ra2/Ra3/Ra5 and ...Rg1/Rh1 lose (-5 to -7).
fen = "R7/6k1/P7/8/8/4K3/8/r7 b - - 0 1"
goal = "draw"
finish = "hold"
tip = "Get your rook to the side of the pawn on the 6th rank (…Rf1–f6) so it attacks a6: their rook must stay on a8 to guard it, and your king stays on g7/h7. When their king comes close, check it from behind; if the pawn reaches a7, put your rook behind it."

