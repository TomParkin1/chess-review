# Essential endgames, played against Stockfish (chessreview/convert.py).
# Every position was checked with Stockfish: "win" positions are won, "draw" positions hold.
#   goal    win | draw          (the side to move is me)
#   finish  the milestone that ends it (Finish M4, P11; a high eval alone never does):
#           mate      = I must deliver checkmate (basic mates)
#           promote   = promote and still be clearly winning after Stockfish's reply
#           bare_king = leave Stockfish with only its king while keeping a queen or rook
#           hold      = draw goals: a draw by rule, or holding for convert.HOLD_MOVES moves
#           (promote and bare_king also end when Stockfish is mated in <= 5)
#   level   1 beginner, 2 intermediate, 3 advanced (a level unlocks when the one before is solved)
# A drawn result (stalemate, repetition, 50-move rule, no mating material) fails a "win" goal,
# so the technique has to be right, not just the eval.
# Acceptance: CHESSREVIEW_PLAYOUTS=1 .venv/bin/pytest tests/test_endgame_playouts.py (strong moves
# win or hold every one; three merely safe moves finish none).

